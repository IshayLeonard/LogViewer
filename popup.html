<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IVR Log Viewer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h2>IVR Log Visualizer</h2>

      <!-- View 1: Home (Input + History) -->
      <div id="home-view">
        <!-- Mode toggles -->
        <div id="modeToggleContainer" class="mode-toggles hidden">
          <a href="#" id="showFetchMode" class="mode-toggle active">Fetch by ID</a>
          <span class="divider">|</span>
          <a href="#" id="showPasteMode" class="mode-toggle">Paste JSON</a>
        </div>

        <div class="input-section hidden" id="fetchSection">
          <div class="fetch-header">
            <span class="fetch-title">Genesys Cloud</span>
            <div class="auth-status-container">
              <div id="orgNameLabel" class="org-name-label hidden"></div>
              <span id="authStatus" class="auth-badge disconnected">🔴 Not Connected</span>
            </div>
          </div>
          <input type="text" id="conversationIdInput" placeholder="Enter Conversation ID..." />
          <div class="purpose-selector">
            <label for="purposeSelect">Participant Purpose:</label>
            <select id="purposeSelect" class="filter-select">
              <option value="External" selected>External (Voice IVR)</option>
              <option value="customer">customer (Digital Bots)</option>
              <option value="Internal">Internal</option>
            </select>
          </div>
          <button id="fetchBtn" disabled>Fetch Participant Data</button>
        </div>

        <div class="input-section" id="pasteSection">
          <textarea
            id="jsonInput"
            placeholder="Paste your JSON log here..."
          ></textarea>
          <button id="visualizeBtn">Visualize Flow</button>
        </div>

        <div class="history-section">
          <h3>Recent History</h3>
          <div id="historyList" class="history-list"></div>
        </div>
      </div>

      <!-- View 2: Visualization -->
      <div id="visualization-view" class="hidden">
        <button id="backBtn" class="back-btn">← Back</button>

        <div class="tab-box">
          <button class="tab-btn active" data-tab="timeline">IVR Flow</button>
          <button class="tab-btn" data-tab="participantData">
            Participant Data
          </button>
        </div>

        <div id="timeline" class="tab-content active"></div>

        <div id="participantData" class="tab-content">
          <table id="participantTable">
            <thead>
              <tr>
                <th>Key</th>
                <th>Value</th>
              </tr>
            </thead>
            <tbody id="participantBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
